name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build only (no push) to catch Dockerfile breakage before a release tag does.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: flow-vs-snmp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (container becomes healthy)
        run: |
          docker run -d --name fvs -p 8501:8501 flow-vs-snmp:ci
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' fvs)
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs fvs
          echo "container did not become healthy (last status: $status)"
          exit 1
