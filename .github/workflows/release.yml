name: Release

# Pushing a tag like v0.0.1 is the only release trigger — the tag is the version.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to ghcr.io

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  image:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io/<owner>/<repo>:0.0.1, :0.0 and :latest from tag v0.0.1. The image name is
      # derived from the repository, so nothing here needs editing after a fork/rename.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${TAG#v}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --notes "Docker image: \`docker pull ${image}\`"
